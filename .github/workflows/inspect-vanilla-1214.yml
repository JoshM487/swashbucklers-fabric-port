name: Inspect Vanilla 1.21.4 Passenger Runtime

on:
  push:
    paths:
      - '.github/workflows/inspect-vanilla-1214.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Mojang 1.21.4 client and official mappings
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o manifest.json
          VERSION_URL=$(python3 - <<'PY'
          import json
          d=json.load(open('manifest.json'))
          print(next(v['url'] for v in d['versions'] if v['id']=='1.21.4'))
          PY
          )
          curl -fsSL "$VERSION_URL" -o version.json
          CLIENT_URL=$(python3 - <<'PY'
          import json
          print(json.load(open('version.json'))['downloads']['client']['url'])
          PY
          )
          MAPPINGS_URL=$(python3 - <<'PY'
          import json
          print(json.load(open('version.json'))['downloads']['client_mappings']['url'])
          PY
          )
          echo "Mojang version URL: $VERSION_URL"
          echo "Mojang client URL: $CLIENT_URL"
          echo "Mojang client mappings URL: $MAPPINGS_URL"
          curl -fsSL "$CLIENT_URL" -o client.jar
          curl -fsSL "$MAPPINGS_URL" -o client.txt

      - name: Print exact Entity passenger and dismount methods
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Official mapping declarations ==='
          grep -B3 -A1 -E 'getPassengerAttachmentPoint\(|getDefaultPassengerAttachmentPoint\(|getDismountLocationForPassenger\(' client.txt | head -n 80
          echo
          javap -classpath client.jar -c -p -s bum > entity.dump
          python3 - <<'PY'
          text=open('entity.dump').read().splitlines()
          wanted={
              '(Lbum;Lbup;F)Lfbb;': 'Entity.getPassengerAttachmentPoint',
              '(Lbum;Lbum;Lbuo;)Lfbb;': 'Entity.getDefaultPassengerAttachmentPoint',
              '(Lbvi;)Lfbb;': 'Entity.getDismountLocationForPassenger',
          }
          for i,line in enumerate(text):
              if line.strip().startswith('descriptor:'):
                  desc=line.split('descriptor:',1)[1].strip()
                  if desc in wanted:
                      start=max(0,i-1)
                      end=min(len(text),i+70)
                      print('===',wanted[desc],desc,'===')
                      print('\n'.join(text[start:end]))
          PY

      - name: Print attachment default factories
        shell: bash
        run: |
          set -euo pipefail
          echo '=== EntityAttachment enum mapping ==='
          grep -A40 '^net.minecraft.world.entity.EntityAttachment -> ' client.txt
          echo '=== EntityAttachments mapping ==='
          grep -A100 '^net.minecraft.world.entity.EntityAttachments -> ' client.txt
          echo '=== EntityAttachments.Builder mapping ==='
          grep -A100 '^net.minecraft.world.entity.EntityAttachments[$]Builder -> ' client.txt || true
          echo '=== EntityAttachment.PointProvider mapping ==='
          grep -A100 '^net.minecraft.world.entity.EntityAttachment[$]' client.txt || true
          echo '=== obfuscated EntityAttachment strategy bytecode bun$a ==='
          javap -classpath client.jar -c -p -s 'bun$a'
          echo '=== obfuscated EntityAttachments.Builder bytecode buo$a ==='
          javap -classpath client.jar -c -p -s 'buo$a'

name: Inspect Minecraft 26.1.2 Boat Physics

on:
  push:
    paths:
      - '.github/workflows/inspect-boat-261.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Prepare Minecraft 26.1.2 runtime
        run: gradle compileJava --no-daemon
      - name: Inspect exact ship port APIs
        shell: bash
        run: |
          set -euo pipefail
          MCJAR="$HOME/.gradle/caches/fabric-loom/26.1.2/minecraft-client.jar"
          test -f "$MCJAR"
          for cls in \
            net.minecraft.world.entity.Entity \
            net.minecraft.world.entity.EntityType \
            net.minecraft.world.entity.Mob \
            net.minecraft.world.entity.PathfinderMob \
            net.minecraft.world.entity.LivingEntity \
            net.minecraft.world.entity.ai.attributes.Attributes \
            net.minecraft.world.item.Item \
            net.minecraft.world.entity.player.Player \
            net.minecraft.world.InteractionResult \
            net.minecraft.world.entity.EntitySpawnReason \
            net.minecraft.client.renderer.entity.MobRenderer \
            net.minecraft.client.renderer.entity.LivingEntityRenderer; do
              echo "=== $cls ==="
              javap -classpath "$MCJAR" -p -s "$cls" | grep -E -A2 -B1 '(^  (public|protected)|create\(|mobInteract|interactAt|startRiding|canAddPassenger|getPassengerAttachmentPoint|getDismountLocation|use\(|consume|shrink|setYBodyRot|setYHeadRot|setNoAi|setPersistence|removeWhenFarAway|canBeCollidedWith|canCollideWith|isPushable|travel\(|setDeltaMovement|getLookAngle|MAX_HEALTH|MOVEMENT_SPEED|ATTACK_DAMAGE|FOLLOW_RANGE|STEP_HEIGHT|KNOCKBACK_RESISTANCE|scale\(|getTextureLocation|createRenderState)' || true
          done
          echo '=== Fabric networking ==='
          CP=$(find "$HOME/.gradle/caches/modules-2/files-2.1" -name '*.jar' -path '*fabric*' -printf '%p:' | sed 's/:$//')
          for cls in \
            net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry \
            net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking \
            net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking\$PlayPayloadHandler \
            net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking\$Context \
            net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking \
            net.fabricmc.fabric.api.object.builder.v1.entity.FabricDefaultAttributeRegistry; do
              echo "=== $cls ==="
              javap -classpath "$CP" -p -s "$cls" | head -n 220 || true
          done

name: Real Fabric 26.1.2 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build for Minecraft 26.1.2
        run: gradle build --stacktrace --warning-mode all

      - name: Production Fabric server smoke test
        continue-on-error: true
        shell: bash
        run: |
          rm -f server-smoke.ok
          set +e
          timeout --kill-after=10s 90s gradle prodServer --no-daemon --stacktrace > prod-server.log 2>&1
          status=$?
          set -e
          tail -n 500 prod-server.log

          if grep -q 'Done (' prod-server.log || grep -q 'Done (' build/prod-server/logs/latest.log 2>/dev/null; then
            echo 'Production Fabric server reached ready state.'
            touch server-smoke.ok
            exit 0
          fi

          echo "Production server did not reach ready state (exit ${status})."
          exit 1

      - name: Ensure XVFB is available
        shell: bash
        run: |
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Production Fabric client and custom-model smoke test
        continue-on-error: true
        shell: bash
        run: |
          rm -f client-smoke.ok
          set +e
          timeout --kill-after=10s 90s gradle prodClient --no-daemon --stacktrace > prod-client.log 2>&1
          status=$?
          set -e
          tail -n 500 prod-client.log

          models=(
            Modelraft
            Modelswashbuckler
            Modelswashbucklerupgraded
            Modelcutterremastered
            Modelcutterweaponisedremastered
            Modelcorvetteclass
          )

          for model in "${models[@]}"; do
            if ! grep -q "SWASHBUCKLERS_MODEL_OK ${model}" prod-client.log; then
              echo "Custom model did not bake successfully: ${model}"
              exit 1
            fi
          done

          if [ "${status}" -ne 0 ] && [ "${status}" -ne 124 ]; then
            echo "Production client exited unexpectedly with status ${status}."
            exit 1
          fi

          echo 'Production Fabric client loaded and all six original ship models baked successfully.'
          touch client-smoke.ok

      - name: Require production validation
        shell: bash
        run: |
          failed=0
          if [ ! -f server-smoke.ok ]; then
            echo 'Server production smoke test failed.'
            failed=1
          fi
          if [ ! -f client-smoke.ok ]; then
            echo 'Client/custom-model production smoke test failed.'
            failed=1
          fi
          exit "${failed}"

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swashbucklers-build
          path: |
            build/libs/*.jar
            prod-server.log
            prod-client.log
            server-smoke.ok
            client-smoke.ok
          if-no-files-found: ignore

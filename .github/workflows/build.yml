name: Real Fabric 26.1.2 Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build against real Minecraft 26.1.2
        run: gradle build --stacktrace --warning-mode all

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swashbucklers-build
          path: build/libs/*.jar
          if-no-files-found: ignore

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version
def portVersion = project.version.toString()
def mcVersion = project.minecraft_version.toString()
def fabricLoaderVersion = project.loader_version.toString()
def fabricApiVersion = project.fabric_api_version.toString()

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

configurations {
    originalSwashbucklers
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    // Original Swashbucklers! 2.6.6B NeoForge 1.21.4 JAR (CurseForge file 6536692).
    // Used only as a source for the author's textures and Blockbench model bytecode.
    originalSwashbucklers "curse.maven:swashbucklers-746320:6536692"

    // Loom production-run tasks load mods from this configuration.
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

def generatedOriginal = layout.buildDirectory.dir('generated/swashbucklers-original')
def prepareOriginalContent = tasks.register('prepareOriginalContent', Exec) {
    inputs.files(configurations.originalSwashbucklers)
    inputs.file('tools/prepare_original.py')
    outputs.dir(generatedOriginal)

    doFirst {
        def originalJar = configurations.originalSwashbucklers.singleFile
        commandLine 'python3',
            file('tools/prepare_original.py').absolutePath,
            originalJar.absolutePath,
            generatedOriginal.get().asFile.absolutePath
    }
}

sourceSets {
    main {
        // src/main/resources remains the authoritative Fabric datapack/resource tree.
        // Generated original client assets are layered in alongside it.
        resources.srcDir(generatedOriginal.map { it.dir('resources') })
    }
}

processResources {
    dependsOn prepareOriginalContent
    inputs.property "version", portVersion
    filesMatching("fabric.mod.json") {
        expand "version": portVersion
    }
}

def expectedShipIds = [
    'hpm:raft',
    'hpm:swashbuckler',
    'hpm:swashbucklerupgraded',
    'hpm:cutter',
    'hpm:cuttermilitarised',
    'hpm:cutter_pirate',
    'hpm:corvette_steamship'
]

def verifyDatapackResources = tasks.register('verifyDatapackResources') {
    dependsOn tasks.named('processResources')

    doLast {
        File processedRoot = layout.buildDirectory.dir('resources/main').get().asFile
        File dataRoot = new File(processedRoot, 'data')
        File boatTag = new File(dataRoot, 'minecraft/tags/entity_type/boat.json')

        def allData = fileTree(dataRoot) { include '**/*.json' }.files
        def recipes = fileTree(new File(dataRoot, 'hpm/recipe')) { include '**/*.json' }.files
        def advancements = fileTree(new File(dataRoot, 'hpm/advancement')) { include '**/*.json' }.files
        def itemTags = fileTree(new File(dataRoot, 'minecraft/tags/item')) { include '**/*.json' }.files

        if (allData.size() != 32) {
            throw new GradleException("Expected 32 processed data JSON files, found ${allData.size()}")
        }
        if (recipes.size() != 15) {
            throw new GradleException("Expected 15 processed recipes, found ${recipes.size()}")
        }
        if (advancements.size() != 13) {
            throw new GradleException("Expected 13 processed advancements, found ${advancements.size()}")
        }
        if (itemTags.size() != 3) {
            throw new GradleException("Expected 3 processed item tags, found ${itemTags.size()}")
        }
        if (!boatTag.isFile()) {
            throw new GradleException('Missing processed data/minecraft/tags/entity_type/boat.json')
        }

        String boatTagText = boatTag.getText('UTF-8')
        expectedShipIds.each { id ->
            if (!boatTagText.contains('"' + id + '"')) {
                throw new GradleException("Boat entity tag is missing ${id}")
            }
        }

        println 'Verified complete processed Swashbucklers datapack resources.'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('jar') {
    dependsOn prepareOriginalContent
    dependsOn verifyDatapackResources
    // Minecraft 26.1 is unobfuscated: Fabric's porting guide replaces remapJar with jar.
    // processResources output (including src/main/resources/data/**) is packaged here.
    from(generatedOriginal.map { it.dir('classes') })
}

tasks.named('sourcesJar') {
    dependsOn prepareOriginalContent
}

// Loom's production server launcher uses the same Fabric server launcher users install.
tasks.register('prodServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    dependsOn tasks.named('jar')
    installerVersion = '1.1.2'
    loaderVersion = fabricLoaderVersion
    minecraftVersion = mcVersion
    mods.from(tasks.named('jar').flatMap { it.archiveFile })
    programArgs.add('nogui')
    runDir = file('build/prod-server')

    // Write EULA into Loom's resolved working directory immediately before its @TaskAction.
    doFirst {
        File dir = runDir.get().asFile
        dir.mkdirs()
        new File(dir, 'eula.txt').setText('eula=true\n', 'UTF-8')
    }
}

// Production client launch validates client entrypoints, model baking, and an actual renderer draw path.
tasks.register('prodClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn tasks.named('jar')
    mods.from(tasks.named('jar').flatMap { it.archiveFile })
    runDir = file('build/prod-client')
    useXVFB = true
    jvmArgs.add('-Dhpm.ci.renderTest=true')
    programArgs.addAll('--quickPlaySingleplayer', 'HpmCiWorld', '--width', '1280', '--height', '720')
}
